<style>
/* Layout: slim title bar, one scrolling terminal column, sticky command chips at the bottom. */
:root{
  /* Mint, sky and white. Light is the default; dark is a calm deep blue-teal. */
  --bg:#F6FAFB; --surface:#FFFFFF; --surface-2:#EAF3FA; --soft:#DDF1EA; --line:#D2E3E6;
  --fg:#243B3A; --muted:#587070; --accent:#2F7F70; --accent-ink:#FFFFFF;
  --ok:#2F7F70; --info:#3A72A8; --warn:#B0654C; --sand:#F6F1E3;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1A22; --surface:#14242E; --surface-2:#1A2E3A; --soft:#1D3340; --line:#2A4452;
  --fg:#E3EEF2; --muted:#98B0BA; --accent:#7FD0BE; --accent-ink:#0E1A22;
  --ok:#7FD0BE; --info:#8DBDE8; --warn:#E5A78F; --sand:#1A2E3A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.7 var(--mono);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:var(--info);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.in{width:100%;max-width:960px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.ttl{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:10px;min-width:0}
.ttl i{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.ttl b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:8px}
.tb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:.82rem;color:var(--muted)}
.tb:hover{color:var(--fg);border-color:var(--accent)}

#out{padding-block:28px 12px}
.blk{margin-bottom:26px;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.echo{margin-bottom:10px;overflow-wrap:anywhere}
.ps{color:var(--ok);font-weight:500}
.pa{color:var(--info)}
.dl{color:var(--accent);font-weight:700}
.h{color:var(--accent);font-weight:700;margin-bottom:8px}
.dim{color:var(--muted)}
.ok{color:var(--ok)}
.bad{color:var(--warn)}
.p{margin:0 0 10px;max-width:74ch}
.rw{display:grid;grid-template-columns:minmax(0,15ch) minmax(0,1fr);gap:2px 18px;margin-bottom:4px}
.cmd{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:4px}
.cmd:hover{color:var(--fg)}

/* intro card */
.me{display:flex;gap:clamp(16px,3vw,28px);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.6vw,24px)}
.me img{width:clamp(104px,22vw,168px);height:auto;aspect-ratio:700/791;object-fit:cover;border-radius:14px;background:#fff;flex:none}
.me .nm{font-family:var(--display);font-weight:750;font-size:clamp(1.7rem,5vw,3rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.me .rl{margin-top:10px;color:var(--muted);max-width:46ch;font-size:.95rem;line-height:1.55}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--fg);background:var(--bg)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.fc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fc b{display:block;font-family:var(--display);font-size:1.5rem;letter-spacing:-.02em;color:var(--accent);line-height:1.1}
.fc span{display:block;font-size:.78rem;color:var(--muted);line-height:1.4;margin-top:4px}

/* lists and cards */
.tl{display:grid;gap:14px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.job .t{font-weight:700}
.job .o{color:var(--info)}
.job .w{color:var(--muted);font-size:.85rem;margin-top:2px}
.job ul{margin:10px 0 0;padding-left:18px}
.job li{margin-bottom:4px;max-width:70ch}
.pl{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;width:100%}
.pr:hover{border-color:var(--accent)}
.pr .n{color:var(--accent);font-weight:700}
.pr .nm{font-weight:700}
.pr .ds{grid-column:2/4;color:var(--muted);font-size:.88rem;line-height:1.5}
.st{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap}
.st.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,26px)}
.card .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 14px;align-items:center}
.card h3{margin:0;font-family:var(--display);font-size:clamp(1.5rem,4vw,2.2rem);letter-spacing:-.02em;line-height:1.05}
.card .ln{margin:12px 0 0;font-weight:500}
.card .bd{margin:10px 0 0;color:var(--muted);max-width:70ch}
.sub{margin-top:20px;color:var(--accent);font-weight:700;font-size:.9rem}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px}
.nd{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.85rem}
.ar{color:var(--accent);animation:nudge 1.6s ease-in-out infinite}
.ar:nth-of-type(2){animation-delay:.2s}.ar:nth-of-type(3){animation-delay:.4s}.ar:nth-of-type(4){animation-delay:.6s}
@keyframes nudge{50%{transform:translateX(3px)}}
.pf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.pf div{background:var(--surface-2);border-radius:10px;padding:12px 14px}
.pf b{display:block;font-family:var(--display);font-size:1.35rem;color:var(--accent);letter-spacing:-.01em;line-height:1.15}
.pf span{display:block;font-size:.8rem;color:var(--muted);line-height:1.45;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{border:1px solid var(--line);border-radius:6px;padding:1px 9px;font-size:.82rem;color:var(--muted)}
.lk{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center}
.lk a{display:inline-block;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 14px;text-decoration:none;color:var(--fg);font-size:.88rem}
.lk a:first-child{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.lk a:hover{border-color:var(--accent)}
.note{color:var(--muted);font-size:.82rem;margin-top:10px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cols .job p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.mail{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px}
.mail code{font:700 clamp(1rem,3vw,1.35rem)/1.3 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;overflow-wrap:anywhere;user-select:all}
.mail button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 14px;font-size:.85rem}
.mail button:hover{border-color:var(--accent)}

/* prompt */
.prompt{display:flex;align-items:center;gap:8px;padding-block:8px 24px}
.prompt label{white-space:nowrap}
#in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font:inherit;caret-color:var(--accent);padding:6px 0}
#in::placeholder{color:var(--muted);opacity:.7}
.dock{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px}
.ch{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.85rem;color:var(--fg)}
.ch:hover{border-color:var(--accent);color:var(--accent)}
.ch.all{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ch.all:hover{color:var(--accent-ink);opacity:.9}

/* welcome avatar and guided tip */
.greet{display:flex;gap:12px;align-items:flex-end}
.av{flex:none;width:58px;height:58px;position:relative}
.av svg{width:100%;height:100%;display:block;border-radius:50%}
.av .wv{position:absolute;right:-8px;top:-6px;font-size:1.25rem;line-height:1;transform-origin:70% 80%;animation:wave 1.3s ease-in-out 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(16deg)}}
.say{position:relative;background:var(--soft);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:46ch;font-size:.92rem;line-height:1.55}
.say p{margin:0}
.say p+p{margin-top:6px;animation:in .35s ease both}
.say b{font-weight:700}
sup{margin-left:.45em;font-size:.72em;line-height:0}
.tip{position:relative;display:flex;gap:10px;align-items:flex-start;margin:6px 0 22px;animation:in .4s ease both}
.tip .av{width:40px;height:40px}
.tip .say{border-radius:4px 16px 16px 16px}
.tip .say::before{content:"";position:absolute;left:-1px;top:-8px;width:14px;height:14px;background:var(--soft);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translate(10px,3px) rotate(45deg);display:none}
.cur{position:absolute;left:14px;top:-26px;width:22px;height:22px;color:var(--accent);animation:point 1.1s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
@keyframes point{50%{transform:translate(-4px,-5px)}}
.tip .x{position:absolute;right:6px;top:2px;border:0;background:none;color:var(--muted);padding:2px 6px;font-size:1rem;line-height:1}
.tip .x:hover{color:var(--fg)}
.tip .say{padding-right:28px}
.prompt label.hl{border-radius:8px;padding:2px 6px;margin-left:-6px;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
.dock .hint{align-self:center;color:var(--muted);font-size:.8rem;margin-right:2px}

@media (max-width:760px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pf,.cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  body{font-size:14px}
  .me{flex-direction:column;align-items:flex-start}
  .me img{width:120px}
  .rw{grid-template-columns:minmax(0,1fr)}
  .tb.opt{display:none}
  .dock .in{gap:6px;padding-block:8px}
  .dock .hint{display:none}
  .av{width:48px;height:48px}
  .ch{padding:4px 11px;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

    '<div class="nm">Lesly Nana Tounda</div>'+
    '<div class="rl">Software engineering student at African Leadership University in Kigali. I build back-ends, web and mobile apps, and the servers they run on.</div>'+
    '<span class="pill"><i></i>Open to software engineering internships</span></div></div>'+
    '<div class="facts"><div class="fc"><b>4.51</b><span>GPA out of 5.00, First Class standing</span></div>'+
    '<div class="fc"><b>2nd</b><span>place, ALU Innovation Challenge, Nov 2025</span></div>'+
    '<div class="fc"><b>8</b><span>projects, four with a live app or deployed API</span></div>'+
    '<div class="fc"><b>EN + FR</b><span>both native, C2</span></div></div>'+
    '<p class="p dim" style="margin-top:16px">Type '+cmd("help")+', or tap a command below. Try '+cmd("experience")+' or '+cmd("projects")+'.</p>';
}
function help(){
  var r=[["about","My mission and why I build"],["experience","Roles, with what I delivered"],["projects","Eight projects, with proof"],["project 1","Open one project, by number or name"],["skills","What I build with and ship with"],["education","Degree and results"],["achievements","Prizes and highlights"],["links","Every project: live app and GitHub"],["contact","Email, GitHub, LinkedIn"],["all","Everything, in one go"],["theme","Switch light and dark"],["clear","Clear the screen"]];
  return '<div class="h">Commands</div>'+r.map(function(x){return '<div class="rw">'+cmd(x[0])+'<span class="dim">'+e(x[1])+'</span></div>'}).join("")+
    '<p class="p dim" style="margin-top:10px">Tab completes a command. Up and down arrows bring back earlier ones.</p>';
}
function about(){
  var src=function(n,u){return '<sup><a href="'+u+'" target="_blank" rel="noopener">'+n+'</a></sup>'};
  return '<div class="h">My mission</div>'+
  '<p class="p">My mission is to make stored grain safe for the smallholder families who grow it across sub-Saharan Africa.</p>'+
  '<p class="p">After harvest, many farming families dry and store their own maize and groundnuts. Mold can produce aflatoxin in that grain, unseen and unsmelled, and aflatoxin is a major risk factor for liver cancer. Families may eat or sell contaminated food without knowing. Solutions exist: a trial in Kenya found that training and post-harvest tools cut aflatoxin in stored maize by over half. But many farmers still lack awareness, an affordable way to check whether grain is safe, and support to act on the result. '+src("qub","https://pure.qub.ac.uk/en/publications/aflatoxin-exposure-and-associated-human-health-effects-a-review-o/")+src("nih","https://pmc.ncbi.nlm.nih.gov/articles/PMC7001978")+'</p>'+
  '<p class="p">I am Dorcase, a software engineering student at African Leadership University, from Cameroon and studying in Rwanda. My agri-tech background, my work on post-harvest food loss, and my English and French let me work across communities in both countries.</p>'+
  '<p class="p">Over my degree, I will move in three stages. First, I will listen to farmers, researchers, and food safety officials to learn where the problem is most severe and who is ready to act. Second, I will choose a country and a group of farmers based on that evidence. Third, I will design and test a low-cost solution, which could combine hardware, software, and training, and measure whether it reduces unsafe grain. I will build it with its users, in their languages, at a price they can afford.</p>'+
  '<p class="p">Success means a farmer can tell, before eating or selling her grain, whether it is safe, and knows what to do if it is not. My capstone will be judged on that outcome, not on the technology I build.</p>'+
  '<p class="p">This mission sits where agriculture and health meet, and I intend to learn it by working in both.</p>'+
  '<p class="note">Next: '+cmd("experience")+', '+cmd("projects")+' or '+cmd("contact")+'.</p>';
}
function experience(){
  return '<div class="h">Experience</div><div class="tl">'+EXP.map(function(x){
    return '<div class="job"><div class="t">'+e(x.t)+'</div><div class="o">'+e(x.o)+'</div><div class="w">'+e(x.w)+'</div><ul>'+x.b.map(function(b){return "<li>"+e(b)+"</li>"}).join("")+'</ul></div>';
  }).join("")+'</div><p class="note">Next: '+cmd("projects")+' or '+cmd("education")+'.</p>';
}
function education(){
  return '<div class="h">Education</div><div class="job"><div class="t">BSc Software Engineering</div><div class="o">African Leadership University</div><div class="w">Kigali, Rwanda. 2025 to 2028</div><ul>'+
  '<li>First Class standing, GPA 4.51 out of 5.00.</li><li>2nd Prize, Best Innovative Business Idea, ALU Innovation Challenge, November 2025.</li><li>Coursework and projects in back-end, web, systems engineering, testing and deployment.</li></ul></div>';
}
function projects(){
  return '<div class="h">Projects</div><div class="pl">'+P.map(function(p,i){
    return '<button type="button" class="pr" data-run="project '+(i+1)+'"><span class="n">['+(i+1)+']</span><span class="nm">'+e(p.n)+'</span><span class="st '+(p.st[0]||"")+'">'+e(p.st[1])+'</span><span class="ds">'+e(p.t)+". "+e(p.line)+'</span></button>';
  }).join("")+'</div><p class="note">Tap a project, or type '+cmd("project 3")+'.</p>';
}
function project(a){
  var q=(a||"").toLowerCase().trim(),p=null;
  if(/^\d+$/.test(q))p=P[+q-1];
  else if(q)p=P.filter(function(x){return x.id.indexOf(q)===0||x.n.toLowerCase().indexOf(q)>-1})[0];
  if(!p)return '<p class="bad">No project matches "'+e(a||"")+'".</p>'+projects();
  var i=P.indexOf(p);
  var flow=p.flow.map(function(f,j){return(j?'<span class="ar">→</span>':"")+'<span class="nd">'+e(f)+"</span>"}).join("");
  var links=p.links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+e(l[0])+"</a>"}).join("");
  return '<div class="card"><div class="top"><h3>'+e(p.n)+'</h3><span class="st '+(p.st[0]||"")+'">'+e(p.st[1])+'</span></div>'+
   '<p class="ln">'+e(p.line)+'</p><p class="bd">'+e(p.body)+'</p>'+
   '<div class="sub">How it is wired</div><div class="flow">'+flow+'</div>'+
   '<div class="sub">What I can show</div><div class="pf">'+p.proof.map(function(x){return "<div><b>"+e(x[0])+"</b><span>"+e(x[1])+"</span></div>"}).join("")+'</div>'+
   '<div class="sub">Built with</div><div class="chips">'+p.stack.map(function(s){return "<span>"+e(s)+"</span>"}).join("")+'</div>'+
   (links?'<div class="sub">Links</div><div class="lk">'+links+'</div>':'<p class="note">'+e(p.note||"")+'</p>')+
   (p.note&&links?'<p class="note">'+e(p.note)+'</p>':'')+'</div>'+
   '<p class="note">'+(i>0?cmd("project "+i,"← previous")+"   ":"")+(i<P.length-1?cmd("project "+(i+2),"next →")+"   ":"")+cmd("projects","all projects")+'</p>';
}
function skills(){
  return '<div class="h">Skills</div><div class="cols">'+
  '<div class="job"><div class="t">Build</div><p>Python, JavaScript, SQL, HTML, CSS, React, Vite, FastAPI, Node.js, Express, Django, Frappe and ERPNext, React Native with Expo, REST APIs</p></div>'+
  '<div class="job"><div class="t">Ship and operate</div><p>HAProxy, Nginx, PM2, SSL and DNS, UFW and iptables, SSH, Docker, GitHub Actions, pytest, Jest, Git and GitHub</p></div>'+
  '<div class="job"><div class="t">Data and research</div><p>PostgreSQL, MongoDB, Supabase, MariaDB, survey design, quantitative analysis, evidence-based reporting</p></div></div>'+
  '<p class="note">Languages: English and French, both native (C2).</p>';
}
function achievements(){
  var a=["2nd Prize, Best Innovative Business Idea, ALU Innovation Challenge (November 2025)","First Class standing at ALU, GPA 4.51 out of 5.00","Millennium Fellow, with AfriCrop built and deployed as my project","BNR Fintech Innovation Hackathon 2026: AgroShield, parametric crop insurance","Research report adopted as the reference document by Yambong Children Association","Project manager of a team that shipped MediCheck with 151 backend tests"];
  return '<div class="h">Achievements</div><div class="job"><ul style="margin:0">'+a.map(function(x){return "<li>"+e(x)+"</li>"}).join("")+'</ul></div>';
}
function contact(){
  return '<div class="h">Contact</div><p class="p">I am looking for a software engineering internship. Email is the fastest way to reach me.</p>'+
  '<div class="mail"><code id="mt">d.nanatoun@alustudent.com</code><button type="button" data-copy="d.nanatoun@alustudent.com">Copy address</button></div>'+
  '<div class="lk"><a href="https://github.com/DTounda" target="_blank" rel="noopener">GitHub</a><a href="https://linkedin.com/in/nana-dorcase-64a355312" target="_blank" rel="noopener">LinkedIn</a></div>'+
  '<p class="note">Based in Kigali, Rwanda. Replies in English or French.</p>';
}
function links(){
  var rows=P.map(function(p){
    var l=p.links.map(function(x){return '<a href="'+x[1]+'" target="_blank" rel="noopener">'+e(x[0])+'</a>'}).join("");
    return '<div class="job"><div class="t">'+e(p.n)+' <span class="st '+(p.st[0]||"")+'">'+e(p.st[1])+'</span></div><div class="lk">'+l+'</div>'+(p.links.some(function(x){return /^(Open|API)/.test(x[0])})?'':'<p class="note">No live deployment. '+cmd("project "+p.id,"See how it runs")+'.</p>')+'</div>';
  }).join("");
  return '<div class="h">All project links</div><div class="tl">'+rows+'</div><div class="lk" style="margin-top:12px"><a href="https://github.com/DTounda" target="_blank" rel="noopener">All repositories on GitHub</a></div>';
}
function all(){return [about(),experience(),education(),projects(),skills(),achievements(),contact()].join('<div style="height:26px"></div>')}

var HANDLERS={help:help,about:about,experience:experience,exp:experience,education:education,projects:projects,project:project,skills:skills,achievements:achievements,contact:contact,links:links,all:all,whoami:who};

/* run */
function add(html,cls){var d=document.createElement("div");d.className="blk"+(cls?" "+cls:"");d.innerHTML=html;out.appendChild(d);return d}
function echo(c){return add('<div class="echo"><span class="ps">lesly@kigali</span><span class="pa">:~</span><span class="dl">$</span> '+e(c)+'</div>')}
function dist(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i]}for(j=0;j<=b.length;j++){m[0][j]=j}
  for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function run(raw,fromUser){
  var c=raw.trim();
  if(!c){echo("");return}
  dismissTip();
  if(fromUser!==false){hist.push(c);hi=hist.length}
  var parts=c.split(/\s+/),name=parts[0].toLowerCase(),arg=parts.slice(1).join(" ");
  if(name==="clear"||name==="cls"){out.innerHTML="";return}
  if(name==="theme"){toggle();echo(c);add('<p class="dim">Theme switched.</p>');return}
  var start=echo(c),res;
  if(name==="history"){res='<div class="h">History</div>'+(hist.length?hist.map(function(h,i){return '<div class="dim">'+(i+1)+"  "+e(h)+"</div>"}).join(""):'<span class="dim">Nothing yet.</span>')}
  else if(name==="ls"){res=P.map(function(p){return '<span style="display:inline-block;min-width:22ch">'+cmd("project "+p.id,p.id)+"</span>"}).join("")}
  else if(name==="sudo"&&/hire/i.test(arg)){res='<p class="ok">[sudo] permission granted.</p><p class="p">Drafting offer letter... done. Please send it to '+cmd("contact")+' and I will reply fast.</p>'}
  else if(name==="sudo"){res='<p class="bad">Nice try. This portfolio is read-only, but you can '+cmd("contact")+' me.</p>'}
  else if(HANDLERS[name]){res=HANDLERS[name](arg)}
  else{
    var best=NAMES.map(function(n){return[n,dist(name,n)]}).sort(function(a,b){return a[1]-b[1]})[0];
    res='<p class="bad">command not found: '+e(name)+'</p><p class="p dim">'+(best[1]<=3?"Did you mean "+cmd(best[0])+"? ":"")+'Type '+cmd("help")+' to see what works.</p>';
  }
  add(res);
  if(fromUser!==false)start.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
}

/* events */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-run],[data-copy]");
  if(!t)return;
  if(t.hasAttribute("data-copy")){
    var txt=t.getAttribute("data-copy");
    var done=function(ok){t.textContent=ok?"Copied":"Select and copy";setTimeout(function(){t.textContent="Copy address"},1800)};
    var fb=function(){try{var r=document.createRange();r.selectNodeContents($("mt"));var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(x){}done(false)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){done(true)},fb);else fb();
    return;
  }
  run(t.getAttribute("data-run"),true);
  if(!coarse)inp.focus();
});
$("form").addEventListener("submit",function(ev){ev.preventDefault();var v=inp.value;inp.value="";run(v,true)});
inp.addEventListener("keydown",function(ev){
  if(ev.key==="ArrowUp"){ev.preventDefault();if(hi>0){hi--;inp.value=hist[hi]}}
  else if(ev.key==="ArrowDown"){ev.preventDefault();if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=""}}
  else if(ev.key==="Tab"){
    ev.preventDefault();
    var v=inp.value,m=v.match(/^(\S+)\s+(\S*)$/);
    if(m&&m[1].toLowerCase()==="project"){
      var hit=P.filter(function(p){return p.id.indexOf(m[2].toLowerCase())===0})[0];
      if(hit)inp.value="project "+hit.id;
    }else if(v&&!/\s/.test(v)){
      var c=NAMES.concat(["ls","exp"]).filter(function(n){return n.indexOf(v.toLowerCase())===0});
      if(c.length===1)inp.value=c[0];
    }
  }else if(ev.key==="l"&&ev.ctrlKey){ev.preventDefault();out.innerHTML=""}
});
document.addEventListener("keydown",function(ev){
  var tag=(ev.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="button"||tag==="a"||ev.ctrlKey||ev.metaKey||ev.altKey)return;
  if(ev.key.length===1)inp.focus();
});
$("clr").addEventListener("click",function(){out.innerHTML=""});

/* theme */
function toggle(){
  var cur=root.getAttribute("data-theme");
  if(!cur)cur=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
  var n=cur==="dark"?"light":"dark";
  root.setAttribute("data-theme",n);
  try{localStorage.setItem("ln-theme2",n)}catch(x){}
}
try{var th=localStorage.getItem("ln-theme2");if(th==="light"||th==="dark")root.setAttribute("data-theme",th)}catch(x){}
$("tgl").addEventListener("click",toggle);

/* dock chips */
var chips=[["about"],["experience"],["projects"],["links"],["skills"],["education"],["contact"],["help"],["show everything","all"]];
$("dock").innerHTML=chips.map(function(c){return '<button type="button" class="ch'+(c[1]?" all":"")+'" data-run="'+(c[1]||c[0])+'">'+c[0]+"</button>"}).join("");

/* welcome avatar and guided tip */
var AV='<svg viewBox="0 0 64 64" aria-hidden="true" style="overflow:hidden"><circle cx="32" cy="32" r="32" fill="#CFE5C8"/><circle cx="32" cy="27" r="19" fill="#2A1C16"/><ellipse cx="32" cy="33" rx="13" ry="15" fill="#8A5A40"/><path d="M19 26c3-9 23-9 26 0-6-4-20-4-26 0z" fill="#2A1C16"/><circle cx="27" cy="33" r="1.6" fill="#2A1C16"/><circle cx="37" cy="33" r="1.6" fill="#2A1C16"/><path d="M27 39c3 3.5 7 3.5 10 0" stroke="#2A1C16" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M8 64c2-11 12-15 24-15s22 4 24 15z" fill="#E9A9B8"/><path d="M24 50c4 5 12 5 16 0" stroke="#fff" stroke-opacity=".6" stroke-width="2" fill="none"/></svg>';
var tipEl=null,demoGo=false,demoOn=false;
function greet(){
  add('<div class="greet"><div class="av">'+AV+'<span class="wv" aria-hidden="true">&#128075;</span></div><div class="say"><p><b>Hi, I am Lesly. Welcome to my portfolio!</b></p><p>This page works like a terminal: you type a short command and it shows you that part of my work.</p></div></div>');
}
function stopDemo(clear){demoGo=false;if(clear&&demoOn)inp.value="";demoOn=false}
function dismissTip(){
  stopDemo(true);
  if(tipEl){tipEl.remove();tipEl=null}
  var l=document.querySelector(".prompt label");if(l)l.classList.remove("hl");
}
function tip(){
  $("form").insertAdjacentHTML("afterend",'<div class="tip" id="tip"><svg class="cur" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2l15 9-6.5 1.8L8 19.5z" fill="currentColor" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg><div class="av">'+AV+'</div><div class="say"><p>Type a command here, for example '+cmd("experience")+', then press Enter to see my experience. Or tap a button below.</p><button type="button" class="x" id="tipx" aria-label="Close tip">&times;</button></div></div>');
  tipEl=$("tip");
  document.querySelector(".prompt label").classList.add("hl");
  tipEl.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"});
  $("tipx").addEventListener("click",dismissTip);
  if(reduce)return;
  var w="experience",i=0;demoGo=true;demoOn=true;
  (function tick(){
    if(!demoGo)return;
    if(i<=w.length){inp.value=w.slice(0,i++);setTimeout(tick,95)}
    else setTimeout(function(){if(demoGo)stopDemo(true)},1600);
  })();
}
inp.addEventListener("input",function(){stopDemo(false)});

/* boot: greet, type whoami, run it, then point at the prompt */
function boot(){
  var text="whoami";
  greet();
  function finish(){inp.value="";echo("whoami");add(who());setTimeout(tip,reduce?0:1500)}
  if(reduce){finish();return}
  var i=0;setTimeout(function tick(){inp.value=text.slice(0,i);if(i++<text.length)setTimeout(tick,70);else setTimeout(finish,260)},500);
}
boot();
})();
</script>
